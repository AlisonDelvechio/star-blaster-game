<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Blaster</title>

    <!-- CSS -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <section class="score-ui">
        <div>
            <span class="score">score: <span>0</span></span>
            <span class="level">level: <span>1</span></span>
            <span class="high">high: <span>0</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div>
            <h1>Star Blaster</h1>
            <button class="button-play">Start</button>
        </div>

         <!-- <div class="instructions">
            <h2>Instructions</h2>
            <p>Use the arrow keys to move the ship and the space bar to shoot.</p>
        </div>  -->
        <span>Alison Version</span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Play Again</button>
        </div>
    </section>

    <canvas></canvas>
    <script type="module" src="src/main.js"></script>
</body>
</html>
