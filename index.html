<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Blaster</title>

    <!-- CSS -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <section class="score-ui">
        <div>
            <span class="score">score: <span>0</span></span>
            <span class="level">level: <span>1</span></span>
            <span class="high">high: <span>0</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div class="start">
            <h1>Star Blaster</h1>
            <button class="button-play">Start</button>
        </div>

         <div class="instructions">
            <h2>Instructions</h2>
            <p>Use the <u>arrow keys</u> to move the ship and the <u>space</u> bar to shoot.</p>
        </div> 

        <div class="credits">
            <a href="https://github.com/AlisonDelvechio" target="_blank">Alison Delvechio Version</a>
        </div>
    </section>

    <section class="select-spaceship screen">
        <div>
            <h1>Select your spaceship</h1>
            <div class="spaceship-list">
                <div class="spaceship" id="spaceship1">
                    <img src="src/assets/images/spaceship.png">
                </div>

                <div class="spaceship" id="spaceship2">
                    <img src="src/assets/images/ship1.png">
                </div>

                <div class="spaceship" id="spaceship3">
                    <img src="src/assets/images/ship2.png">
                </div>

                <div class="spaceship" id="spaceship4">
                    <img src="src/assets/images/ship3.png">
                </div>
            </div>
            <button class="button-select">Select</button>
        </div>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Play Again</button>
        </div>
    </section>

    <canvas></canvas>
    <script type="module" src="src/main.js"></script>
</body>
</html>
